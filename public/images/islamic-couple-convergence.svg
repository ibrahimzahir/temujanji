<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <filter id="gold-bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feColorMatrix type="matrix" values="1 0 0 0 0.85  0 1 0 0 0.68  0 0 1 0 0.35  0 0 0 0.6 0" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1A1412" flood-opacity="0.15" />
    </filter>
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <radialGradient id="halo-glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#FBF6EB" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#EED9A4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Sacred Halo Background -->
  <circle id="ambient-halo" cx="500" cy="480" r="380" fill="url(#halo-glow)" />

