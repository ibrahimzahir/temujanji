  <!-- 3. UNITED SEAMLESS EMBRACE (Final locked position overlay) -->
  <g id="united-embrace-group" class="united-figure" opacity="0">
    <image href="/images/islamic-couple-front-united.png" x="0" y="0" width="1000" height="1000" preserveAspectRatio="xMidYMid meet" />
  </g>
